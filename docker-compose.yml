services:
  brainpile-core:
    build: ./core
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://brainpile:brainpile@postgres:5432/brainpile
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_PUBLIC_ENDPOINT=http://127.0.0.1:8333
      - S3_ACCESS_KEY=brainpile-admin
      - S3_SECRET_KEY=brainpile-admin
      - EMBEDDING_API_URL=http://brainpile-jina:8000
      - VLM_API_BASE=${VLM_API_BASE}
      - VLM_API_KEY=${VLM_API_KEY}
      - VLM_MODEL=${VLM_MODEL}
      - TG_BOT_TOKEN=${TG_BOT_TOKEN}
      - RUST_LOG=info
    depends_on:
      - postgres
      - seaweedfs
      - brainpile-jina
    restart: unless-stopped

  brainpile-frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - brainpile-core
    restart: unless-stopped

  brainpile-jina:
    build: ./jina
    ports:
      - "8000:8000"
    volumes:
      # 默认挂载项目内 models/ 目录；缺文件时 entrypoint 会自动下载到此处
      - ./models:/models
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=brainpile
      - POSTGRES_PASSWORD=brainpile
      - POSTGRES_DB=brainpile
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: mini -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -webdav=false -admin.ui=false
    ports:
      - "8333:8333"
    environment:
      - AWS_ACCESS_KEY_ID=brainpile-admin
      - AWS_SECRET_ACCESS_KEY=brainpile-admin
      - S3_BUCKET=brainpile
    volumes:
      - ./data/seaweedfs:/data
    restart: unless-stopped
